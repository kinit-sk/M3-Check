run_args:
  experiment_name: llama_transformer[dinov2+partial_tied_init_modalities]
  description:

args:
  embedder_image: DINOv2
  
modalities:
  posts:
    ocr:
      modality: ocr_combined

model:
  _target_: models.RetrievalLammaTransformer
  config:
    _target_: models.make_llama_config
    hidden_size: ${args.emb_dim}
    intermediate_size: 64
    num_attention_heads: 4
    num_hidden_layers: 3
  modality_tied_init_projections:
    ocr: text
