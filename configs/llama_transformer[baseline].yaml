run_args:
  experiment_name: llama_transformer[baseline]
  description:

modalities:
  posts:
    ocr:
      modality: ocr_combined

model:
  _target_: models.RetrievalLammaTransformer
  config:
    _target_: models.make_llama_config
    hidden_size: ${args.emb_dim}
    intermediate_size: 64
    num_attention_heads: 4
    num_hidden_layers: 3
  tied: true
  tied_init: false
  tied_projections: false
  tied_init_projections: false
  modality_tied_init_projections: false
  linear_init_projections: null
  linear_init_transformer: null