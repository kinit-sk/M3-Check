run_args:
  experiment_name: llama_transformer[untied_pa_tied_init]
  description:

modalities:
  posts:
    ocr:
      modality: ocr_combined

model:
  _target_: models.RetrievalLammaTransformer
  config:
    _target_: models.make_llama_config
    hidden_size: ${args.emb_dim}
    intermediate_size: 64
    num_attention_heads: 4
    num_hidden_layers: 3
  tied: false
  tied_init: true
  tied_init_projections: true