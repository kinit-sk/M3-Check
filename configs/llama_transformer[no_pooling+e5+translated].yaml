run_args:
  experiment_name: llama_transformer[no_pooling+e5+translated]
  description:

args:
  embedder_text: E5
  embedder_ocr: E5
  
modalities:
  posts:
    text:
      language: translated

    ocr:
      modality: ocr_combined
      language: translated

model:
  _target_: models.RetrievalLammaTransformer
  config:
    _target_: models.make_llama_config
    hidden_size: ${args.emb_dim}
    intermediate_size: 64
    num_attention_heads: 4
    num_hidden_layers: 3
  output_token: 0
